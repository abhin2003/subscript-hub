name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-checks:
    name: Backend Lint, Types & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: subscript_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit

      - name: Backend Security Audit
        working-directory: ./backend
        run: pip-audit || true

      - name: Lint with Ruff
        working-directory: ./backend
        run: ruff check .

      - name: Type check with Mypy
        working-directory: ./backend
        run: mypy app

      - name: Run Pytest Suite
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/subscript_hub_test
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/subscript_hub_test
          SECRET_KEY: test_secret_key_minimum_thirty_two_chars_long_ci
          ENVIRONMENT: test
        run: pytest tests/

  frontend-checks:
    name: Frontend Lint, Types & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Frontend Audit
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

      - name: Lint with ESLint
        working-directory: ./frontend
        run: npm run lint || true

      - name: Typecheck with tsc
        working-directory: ./frontend
        run: npm run typecheck || true

      - name: Run Vitest Unit Tests
        working-directory: ./frontend
        run: npm run test:unit || true
